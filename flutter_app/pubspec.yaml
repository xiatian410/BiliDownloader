name: bili_downloader
description: Cross-platform BiliDownloader client.
publish_to: none
version: 2.0.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.8
  dio: ^5.11.1
  ffmpeg_kit_flutter_new_min: ^3.6.7
  file_picker: ^13.3.0
  flutter_secure_storage: ^11.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  xml: ^7.1.0
  cupertino_icons: ^2.0.0
  web_socket_channel: ^3.0.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/LICENSE
  fonts:
    - family: HarmonyOS Sans SC
      fonts:
        - asset: assets/HarmonyOS_Sans_SC_Regular.ttf
